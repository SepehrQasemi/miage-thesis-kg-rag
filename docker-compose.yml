services:
  neo4j:
    image: neo4j:5-community
    container_name: miage-thesis-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MIAGE_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${MIAGE_NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${MIAGE_NEO4J_USER:-neo4j}/${MIAGE_NEO4J_PASSWORD:?MIAGE_NEO4J_PASSWORD must be set in .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs: